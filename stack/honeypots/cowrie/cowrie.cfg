# Cowrie SSH and Telnet honeypot.
#
# The goal is to hold an attacker long enough to observe what they intend to do,
# so the emulated host answers plausibly and records everything. Nothing here
# grants real execution: Cowrie's shell is emulated and the filesystem is a
# snapshot image.

[honeypot]
hostname = web-prod-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
share_path = share/cowrie
state_path = var/lib/cowrie
etc_path = etc
contents_path = honeyfs
filesystem_file = share/cowrie/fs.pickle
txtcmds_path = txtcmds

# Attackers commonly disconnect immediately from an obviously idle host. A
# generous timeout keeps sessions open long enough to capture full activity.
interactive_timeout = 300
authentication_timeout = 120
backend = shell

# Captured downloads are the most valuable artefact the honeypot produces, so
# they are always retained and hashed.
download_limit_size = 20971520

[shell]
filesystem = share/cowrie/fs.pickle
processes = share/cowrie/cmdoutput.json
arch = linux-x64-lsb
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
# Offering a broad algorithm set keeps older botnet clients from failing the
# handshake, which would lose the session before anything is observed.
ciphers = aes128-ctr,aes192-ctr,aes256-ctr,aes256-cbc,aes128-cbc,3des-cbc
macs = hmac-sha2-512,hmac-sha2-256,hmac-sha1,hmac-md5
compression = zlib@openssh.com,zlib,none
sftp_enabled = true
forwarding = true
forward_redirect = false
auth_none_enabled = false
auth_keyboard_interactive_enabled = true

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
reported_port = 23

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false

# Hashing every captured binary lets a sample be correlated against public
# reputation data without transmitting the file itself.
[output_hashlog]
enabled = true
logfile = var/log/cowrie/hashlog.txt
