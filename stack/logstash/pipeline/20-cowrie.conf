# Cowrie session reconstruction.
#
# Cowrie emits a stream of small events keyed by session id. The useful unit of
# analysis is the session, so each event carries the identifiers needed to group
# them later, and the high value events (credentials, commands, downloads) are
# normalised into shared field names used across every honeypot.

filter {
  if "cowrie" in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      rename => {
        "src_ip"   => "[source][ip]"
        "src_port" => "[source][port]"
        "dst_ip"   => "[destination][ip]"
        "dst_port" => "[destination][port]"
        "session"  => "[session][id]"
      }
      add_field => {
        "[event][module]"  => "cowrie"
        "[event][dataset]" => "honeypot.session"
      }
    }

    # eventid drives everything downstream; map it onto a stable taxonomy so a
    # dashboard does not need to know Cowrie's internal event names.
    if [eventid] == "cowrie.login.success" or [eventid] == "cowrie.login.failed" {
      mutate {
        rename => {
          "username" => "[user][name]"
          "password" => "[user][password]"
        }
        add_field => { "[event][category]" => "authentication" }
      }

      if [eventid] == "cowrie.login.success" {
        mutate {
          add_field => {
            "[event][outcome]" => "success"
            "[threat][stage]"  => "credential-access"
          }
        }
      } else {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      }
    }

    else if [eventid] == "cowrie.command.input" {
      mutate {
        rename => { "input" => "[process][command_line]" }
        add_field => {
          "[event][category]" => "process"
          "[threat][stage]"   => "execution"
        }
      }

      # Commands are the richest signal the honeypot produces. Pull out the
      # indicators that get pivoted on most: fetched URLs and encoded payloads.
      grok {
        match => { "[process][command_line]" => "%{URL_IN_TEXT:[threat][indicator][url]}" }
        patterns_dir => ["/usr/share/logstash/patterns"]
        tag_on_failure => []
      }

      grok {
        match => { "[process][command_line]" => "%{BASE64_BLOB:[threat][indicator][base64]}" }
        patterns_dir => ["/usr/share/logstash/patterns"]
        tag_on_failure => []
      }

      if [threat][indicator][base64] {
        ruby {
          # Decoding inline lets a analyst search the plaintext of an obfuscated
          # dropper without exporting the event first.
          code => '
            require "base64"
            blob = event.get("[threat][indicator][base64]")
            begin
              decoded = Base64.strict_decode64(blob)
              if decoded.force_encoding("UTF-8").valid_encoding?
                event.set("[threat][indicator][base64_decoded]", decoded[0, 4096])
              end
            rescue ArgumentError
              event.tag("base64_decode_failed")
            end
          '
        }
      }
    }

    else if [eventid] =~ /^cowrie\.session\.file_download/ {
      mutate {
        rename => {
          "url"      => "[threat][indicator][url]"
          "shasum"   => "[file][hash][sha256]"
          "outfile"  => "[file][path]"
        }
        add_field => {
          "[event][category]" => "malware"
          "[threat][stage]"   => "ingress-tool-transfer"
        }
      }
    }

    else if [eventid] == "cowrie.session.connect" {
      mutate { add_field => { "[event][category]" => "network" } }
    }

    # Cowrie reports the client version string, which fingerprints the tooling
    # far more reliably than the source address does.
    if [version] {
      mutate { rename => { "version" => "[client][version]" } }
    }
  }
}
