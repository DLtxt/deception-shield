# Suricata EVE normalisation.
#
# Suricata's verdict is what turns raw traffic into a named technique. Alerts
# carry the signature and severity; flow records carry the byte and packet
# counts that separate a single probe from a sustained session.

filter {
  if "suricata" in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      rename => {
        "src_ip"    => "[source][ip]"
        "src_port"  => "[source][port]"
        "dest_ip"   => "[destination][ip]"
        "dest_port" => "[destination][port]"
        "proto"     => "[network][transport]"
        "app_proto" => "[network][protocol]"
        "flow_id"   => "[network][flow_id]"
      }
      add_field => { "[event][module]" => "suricata" }
      lowercase => ["[network][transport]"]
    }

    if [event_type] == "alert" {
      mutate {
        rename => {
          "[alert][signature]"    => "[rule][name]"
          "[alert][signature_id]" => "[rule][id]"
          "[alert][category]"     => "[rule][category]"
          "[alert][severity]"     => "[event][severity]"
        }
        add_field => {
          "[event][kind]"     => "alert"
          "[event][dataset]"  => "suricata.alert"
          "[event][category]" => "intrusion_detection"
        }
      }

      # Suricata severity runs 1 (most severe) to 4. Invert it so that higher
      # numbers mean higher risk, matching every other score in the index.
      ruby {
        code => '
          sev = event.get("[event][severity]")
          event.set("[event][risk_score]", sev ? (5 - sev.to_i) * 25 : 0)
        '
      }
    }

    else if [event_type] == "flow" {
      mutate {
        rename => {
          "[flow][pkts_toserver]"  => "[source][packets]"
          "[flow][pkts_toclient]"  => "[destination][packets]"
          "[flow][bytes_toserver]" => "[source][bytes]"
          "[flow][bytes_toclient]" => "[destination][bytes]"
          "[flow][state]"          => "[network][state]"
        }
        add_field => {
          "[event][kind]"    => "event"
          "[event][dataset]" => "suricata.flow"
        }
      }

      ruby {
        code => '
          s = event.get("[source][bytes]").to_i
          d = event.get("[destination][bytes]").to_i
          event.set("[network][bytes]", s + d)
          # A flow the sensor never answered is a scan touch rather than a
          # conversation. The ratio separates the two cheaply at query time.
          event.set("[network][response_ratio]", s > 0 ? (d.to_f / s).round(4) : 0.0)
        '
      }
    }

    else if [event_type] == "http" {
      mutate {
        rename => {
          "[http][hostname]"      => "[url][domain]"
          "[http][url]"           => "[url][path]"
          "[http][http_user_agent]" => "[user_agent][original]"
          "[http][http_method]"   => "[http][request][method]"
          "[http][status]"        => "[http][response][status_code]"
        }
        add_field => { "[event][dataset]" => "suricata.http" }
      }
    }

    else if [event_type] == "tls" {
      mutate {
        rename => {
          "[tls][sni]"         => "[tls][client][server_name]"
          "[tls][ja3][hash]"   => "[tls][client][ja3]"
          "[tls][ja3s][hash]"  => "[tls][server][ja3s]"
        }
        add_field => { "[event][dataset]" => "suricata.tls" }
      }
    }
  }
}
