# Shared enrichment applied to every source.
#
# Geography and autonomous system come from the bundled MaxMind databases that
# ship with Logstash, so enrichment happens inline with no external lookup on
# the ingest path.

filter {
  if [source][ip] and [source][ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)/ {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
      fields => ["city_name", "country_name", "country_code2", "continent_code", "location", "region_name"]
      tag_on_failure => ["_geoip_lookup_failed"]
    }

    geoip {
      source => "[source][ip]"
      target => "[source][as]"
      default_database_type => "ASN"
      tag_on_failure => ["_asn_lookup_failed"]
    }

    mutate { add_field => { "[source][is_external]" => "true" } }
  } else {
    mutate { add_field => { "[source][is_external]" => "false" } }
  }

  # Every document carries the sensor that observed it. With more than one
  # sensor deployed, comparing what each one sees is how campaigns that target a
  # specific address range get separated from untargeted internet noise. A
  # document that already names its observer keeps it: adding a second value
  # would turn the field into an array.
  if ![observer][name] {
    mutate { add_field => { "[observer][name]" => "${SENSOR_ID:local-sensor}" } }
  }
  if ![observer][type] {
    mutate { add_field => { "[observer][type]" => "honeypot-sensor" } }
  }

  # Fingerprint the event so that a capture replayed twice does not duplicate
  # documents in the index.
  if "cowrie" in [tags] {
    # Cowrie emits bursts of events inside one millisecond: a pasted script
    # arrives as one command.input per line. Source, port and a millisecond
    # timestamp would give every event in the burst the same id, and the
    # create-only output would drop all but the first, silently truncating the
    # session. The session, the event type, Cowrie's own microsecond timestamp
    # and the command keep them apart while a replay still deduplicates.
    fingerprint {
      source => ["[session][id]", "eventid", "timestamp", "[process][command_line]", "[source][ip]", "[event][dataset]"]
      target => "[event][id]"
      method => "SHA256"
      concatenate_sources => true
    }
  } else {
    fingerprint {
      source => ["[source][ip]", "[destination][port]", "@timestamp", "[event][dataset]"]
      target => "[event][id]"
      method => "SHA256"
      concatenate_sources => true
    }
  }

  mutate {
    remove_field => ["host", "path", "@version", "timestamp", "message_raw"]
  }
}
