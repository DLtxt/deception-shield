# Each source arrives on its own channel and is tagged immediately so the filter
# stages downstream can branch without guessing at the shape of the document.

input {
  # Cowrie writes newline delimited JSON, one object per session event.
  file {
    path => "/honeypot/cowrie/log/cowrie.json*"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_cowrie"
    codec => json
    tags => ["cowrie", "honeypot"]
    mode => "tail"
  }

  # Suricata EVE output: alerts, flows, and protocol records.
  file {
    path => "/honeypot/suricata/eve.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_suricata"
    codec => json
    tags => ["suricata", "ids"]
    mode => "tail"
  }

  file {
    path => "/honeypot/dionaea/log/dionaea.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_dionaea"
    codec => json
    tags => ["dionaea", "honeypot"]
    mode => "tail"
  }

  # Records dissected out of rotated captures by tshark.
  tcp {
    port => 5400
    codec => json_lines
    tags => ["tshark", "pcap"]
  }

  beats {
    port => 5044
    tags => ["beats"]
  }
}
