# Payload records produced by the tshark extractor.
#
# These documents already arrive structured, because dissection happened in
# Wireshark's engine rather than here. This stage lines the field names up with
# the honeypot and IDS documents so that a single query spans all three, and
# scores each payload for the traits that distinguish exploitation attempts
# from background noise.

filter {
  if "tshark" in [tags] {
    date {
      match => ["frame_time", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "[event][module]"   => "tshark"
        "[event][dataset]"  => "pcap.payload"
        "[event][kind]"     => "event"
        "[event][category]" => "network"
      }
      convert => {
        "[source][port]"      => "integer"
        "[destination][port]" => "integer"
        "[network][bytes]"    => "integer"
        "payload_length"      => "integer"
      }
    }

    # Payload heuristics. Each match is additive, so a request that both walks
    # directories and pipes to a shell scores higher than one doing either.
    if [payload_ascii] {
      ruby {
        path => "/usr/share/logstash/patterns/score_payload.rb"
        script_params => { "field" => "payload_ascii" }
      }
    }

    if [threat][indicator][url] {
      mutate { add_field => { "[threat][stage]" => "ingress-tool-transfer" } }
    }

    # Retain the hex only when something in the payload looked interesting;
    # keeping every hex dump inflates the index without adding signal.
    if [threat][payload_score] and [threat][payload_score] < 20 {
      mutate { remove_field => ["payload_hex"] }
    }
  }
}
