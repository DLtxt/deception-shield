# Routing.
#
# Datasets land in separate data streams so that retention can differ: alerts
# are small and worth keeping, full payload records are large and age out
# sooner. The index templates in elasticsearch/index-templates define both.

output {
  if "cowrie" in [tags] or "dionaea" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOST:http://elasticsearch:9200}"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "honeypot"
      data_stream_namespace => "deception"
      document_id => "%{[event][id]}"
      action => "create"
    }
  }

  else if "suricata" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOST:http://elasticsearch:9200}"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "suricata"
      data_stream_namespace => "deception"
    }
  }

  else if "tshark" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOST:http://elasticsearch:9200}"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "pcap"
      data_stream_namespace => "deception"
    }
  }

  # Anything that reached the pipeline without matching a known source is kept
  # rather than dropped, so a misrouted input surfaces instead of vanishing.
  else {
    elasticsearch {
      hosts => ["${ELASTIC_HOST:http://elasticsearch:9200}"]
      index => "deception-unrouted-%{+YYYY.MM.dd}"
    }
  }
}
