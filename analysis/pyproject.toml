[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deception-shield"
version = "1.0.0"
description = "Packet capture dissection and attack pattern analysis for the Deception Shield honeypot network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "elasticsearch>=8.12,<9",
  "boto3>=1.34",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]

[project.scripts]
deception-shield = "deception_shield.cli:main"

[tool.setuptools.packages.find]
include = ["deception_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
