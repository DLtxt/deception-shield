---
- name: Install the packages the sensor needs
  ansible.builtin.apt:
    name:
      - tcpdump
      - tshark
      - jq
      - python3-pip
      - python3-venv
      - awscli
      - unzip
      - htop
      - iotop
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the service account for the extractor
  ansible.builtin.user:
    name: extractor
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the sensor directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: /etc/deception-shield }
    - { path: /opt/deception-shield }
    - { path: /data/pcap, owner: root, group: extractor, mode: "0775" }
    - { path: /data/extracted, owner: extractor, group: extractor, mode: "0755" }

- name: Apply the kernel tuning the sensor depends on
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-sensor.conf
    reload: true
    state: present
  loop:
    # Elasticsearch refuses to start below this.
    - { name: vm.max_map_count, value: "262144" }
    # The sensor receives large volumes of half open connections by design.
    - { name: net.ipv4.tcp_max_syn_backlog, value: "8192" }
    - { name: net.core.somaxconn, value: "4096" }
    - { name: net.ipv4.tcp_syncookies, value: "1" }
    - { name: net.netfilter.nf_conntrack_max, value: "524288" }

- name: Write the sensor environment file
  ansible.builtin.template:
    src: sensor.env.j2
    dest: /etc/deception-shield/sensor.env
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart capture
    - restart extractor

- name: Cap the journal so logs cannot fill the root volume
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-sensor.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=2G
      MaxRetentionSec=2week
  notify: restart journald
